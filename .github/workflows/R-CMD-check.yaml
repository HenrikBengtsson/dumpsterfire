# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"never"'

      - name: Verify build and install success
        run: |
          log_files <- list.files("check", pattern = "00check.log", recursive = TRUE, full.names = TRUE)
          if (length(log_files) == 0) {
            stop("Error: No 00check.log found. The package build probably failed completely.")
          }
          log_content <- readLines(log_files[1])
          install_ok <- any(grepl("checking whether package .* can be installed ... OK", log_content))
          if (!install_ok) {
            stop("Error: Package installation failed or was not verified in 00check.log.")
          }
          message("Success: Package built and installed successfully.")
        shell: Rscript {0}

      - name: Upload 00check.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check/**/*.Rcheck/00check.log
          if-no-files-found: ignore

  update-status:
    needs: R-CMD-check
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all 00check.log artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloaded-logs

      - name: Update status branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches to ensure we see the status branch if it exists
          git fetch origin
          
          # Switch to status branch, or create it if it doesn't exist
          if git checkout status; then
            git pull origin status
          else
            git checkout --orphan status
            git rm -rf .
          fi
          
          # Copy downloaded logs to corresponding subfolders
          if [ -d "downloaded-logs" ]; then
            for dir in downloaded-logs/*; do
              if [ -d "$dir" ]; then
                log_file=$(find "$dir" -name "00check.log" -print -quit)
                if [ -n "$log_file" ] && [ -f "$log_file" ]; then
                  name=$(basename "$dir")
                  # name is <os>-<r>
                  if [[ "$name" == ubuntu-latest-* ]]; then
                    os="ubuntu-latest"
                    r="${name#ubuntu-latest-}"
                  elif [[ "$name" == macos-latest-* ]]; then
                    os="macos-latest"
                    r="${name#macos-latest-}"
                  elif [[ "$name" == windows-latest-* ]]; then
                    os="windows-latest"
                    r="${name#windows-latest-}"
                  else
                    continue
                  fi
                  mkdir -p "$os/$r"
                  cp "$log_file" "$os/$r/00check.log"
                  echo "Copied $log_file to $os/$r/00check.log"
                else
                  echo "No 00check.log found in $dir"
                fi
              fi
            done
            # Remove downloaded logs temp dir
            rm -rf downloaded-logs
          else
            echo "No downloaded logs found."
          fi
          
          # Check if there are any changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update R CMD check logs [skip ci]"
            git push origin status
          else
            echo "No changes to commit."
          fi


